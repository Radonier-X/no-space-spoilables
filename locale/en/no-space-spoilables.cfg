[mod-description]
no-space-spoilables=Makes it so that spoilable items in space are paused in their spoilage state. Has options for power draw and technology based research

[mod-setting-name]
nss-spoil-update-tick-interval=Nth tick for spoilables update
nss-power-per-stack=Power required for stack
nss-technology-required=Technology required for activation

[mod-setting-description]
nss-spoil-update-tick-interval=The Nth tick when the spoilable items in the space hub are updated
nss-power-per-stack=The power required for each spoilable stack in the hub. Lack of power will result in failure of all hub spoilable resources. \nSet to 0 for no power draw
nss-technology-required=Technology required for the hub to start freezing the spoilable items. \nSet to none for no requirement

[string-mod-setting]
nss-technology-required-none=None
nss-technology-required-space-platform=Space platform
nss-technology-required-agricultural-science-pack=Agricultural science pack
nss-technology-required-cryogenic-science-pack=Cryogentic science pack

[string-mod-setting-description]
nss-technology-required-none=No requirement
nss-technology-required-space-platform=Requires Space platform to be researched
nss-technology-required-agricultural-science-pack=Requires Agricultural science pack to be researched
nss-technology-required-cryogenic-science-pack=Requires Cryogentic science pack to be researched

[entity-name]
nss-space-refrigeration-interface=Space refrigerator interface

[entity-description]
nss-space-refrigeration-interface=Power interface for the hub for freezing spoilable stacks

[technology-name]
nss-space-platfrom-refrigeration=Space platform refrigeration

[technology-description]
nss-space-platfrom-refrigeration=Enables space platform hubs to freeze the spoilable items contained within them 

[gui-nss-space-refrigeration]
frame-title=[img=virtual-signal/signal-snowflake] Refrigeration
switch-off=Off
switch-on=On
circuit-checkbox=Enable circuit \nnetwork control
