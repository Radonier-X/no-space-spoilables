[mod-description]
no-space-spoilables=Makes it so that spoilable items in space are paused in their spoilage state. Has options for power draw and technology based research

[mod-setting-name]
spoil-update-tick-interval=Nth tick for spoilables update
power-per-stack=Power required for stack
technology-required=Technology required for activation

[mod-setting-description]
spoil-update-tick-interval=The Nth tick when the spoilable items in the space hub are updated
power-per-stack=The power required for each spoilable stack in the hub. Lack of power will result in failure of all hub spoilable resources. \nSet to 0 for no power draw
technology-required=Technology required for the hub to start freezing the spoilable items. \nSet to none for no requirement

[string-mod-setting]
technology-required-none=None
technology-required-space-platform=Space platform
technology-required-agricultural-science-pack=Agricultural science pack
technology-required-cryogenic-science-pack=Cryogentic science pack

[string-mod-setting-description]
technology-required-none=No requirement
technology-required-space-platform=Requires Space platform to be researched
technology-required-agricultural-science-pack=Requires Agricultural science pack to be researched
technology-required-cryogenic-science-pack=Requires Cryogentic science pack to be researched

[entity-name]
space-refrigeration-interface=Space refrigerator interface

[entity-description]
space-refrigeration-interface=Power interface for the hub for freezing spoilable stacks

[technology-name]
space-platfrom-refrigeration=Space platform refrigeration

[technology-description]
space-platfrom-refrigeration=Enables space platform hubs to freeze the spoilable items contained within them 
